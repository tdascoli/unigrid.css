<!-- Step 2: Address -->
<div class="step-panel" role="group" aria-labelledby="step-address-title">
  <div class="step-panel__header">
    <h2 id="step-address-title" class="step-panel__title">Address</h2>
    <p class="step-panel__description">
      Where should we send your welcome package?
    </p>
  </div>

  <form
    class="step-panel__form"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
  >
    <!-- Street — full width -->
    <div class="form-field form-field--full">
      <label class="form-field__label" for="street">
        Street address <span class="form-field__required" aria-hidden="true">*</span>
      </label>
      <input
        id="street"
        class="form-field__input"
        [class.form-field__input--error]="shouldShowError('street')"
        [class.form-field__input--valid]="fieldTouched['street'] && !shouldShowError('street') && form.get('street')?.value"
        type="text"
        formControlName="street"
        autocomplete="street-address"
        placeholder="e.g. Bahnhofstrasse 42"
        [attr.aria-invalid]="shouldShowError('street')"
        [attr.aria-describedby]="shouldShowError('street') ? 'street-error' : null"
        (blur)="onFieldBlur('street')"
      />
      <p
        *ngIf="shouldShowError('street')"
        id="street-error"
        class="form-field__error"
        role="alert"
      >
        {{ getErrorMessage('street') }}
      </p>
    </div>

    <!-- City + Postal Code row -->
    <div class="form-grid">
      <!-- City -->
      <div class="form-field">
        <label class="form-field__label" for="city">
          City <span class="form-field__required" aria-hidden="true">*</span>
        </label>
        <input
          id="city"
          class="form-field__input"
          [class.form-field__input--error]="shouldShowError('city')"
          [class.form-field__input--valid]="fieldTouched['city'] && !shouldShowError('city') && form.get('city')?.value"
          type="text"
          formControlName="city"
          autocomplete="address-level2"
          placeholder="e.g. Zurich"
          [attr.aria-invalid]="shouldShowError('city')"
          [attr.aria-describedby]="shouldShowError('city') ? 'city-error' : null"
          (blur)="onFieldBlur('city')"
        />
        <p
          *ngIf="shouldShowError('city')"
          id="city-error"
          class="form-field__error"
          role="alert"
        >
          {{ getErrorMessage('city') }}
        </p>
      </div>

      <!-- Postal Code -->
      <div class="form-field">
        <label class="form-field__label" for="postalCode">
          Postal code <span class="form-field__required" aria-hidden="true">*</span>
        </label>
        <input
          id="postalCode"
          class="form-field__input"
          [class.form-field__input--error]="shouldShowError('postalCode')"
          [class.form-field__input--valid]="fieldTouched['postalCode'] && !shouldShowError('postalCode') && form.get('postalCode')?.value"
          type="text"
          inputmode="text"
          formControlName="postalCode"
          autocomplete="postal-code"
          placeholder="e.g. 8001"
          [attr.aria-invalid]="shouldShowError('postalCode')"
          [attr.aria-describedby]="shouldShowError('postalCode') ? 'postalCode-error' : null"
          (blur)="onFieldBlur('postalCode')"
        />
        <p
          *ngIf="shouldShowError('postalCode')"
          id="postalCode-error"
          class="form-field__error"
          role="alert"
        >
          {{ getErrorMessage('postalCode') }}
        </p>
      </div>
    </div>

    <!-- Country — full width, smart default from locale -->
    <div class="form-field form-field--full">
      <label class="form-field__label" for="country">
        Country <span class="form-field__required" aria-hidden="true">*</span>
      </label>
      <select
        id="country"
        class="form-field__input form-field__select"
        [class.form-field__input--error]="shouldShowError('country')"
        formControlName="country"
        autocomplete="country"
        [attr.aria-invalid]="shouldShowError('country')"
        [attr.aria-describedby]="shouldShowError('country') ? 'country-error' : 'country-help'"
        (blur)="onFieldBlur('country')"
      >
        <option value="" disabled>Select a country</option>
        <option *ngFor="let c of countries" [value]="c.code">
          {{ c.name }}
        </option>
      </select>
      <p id="country-help" class="form-field__help" *ngIf="!shouldShowError('country')">
        Auto-detected from your browser settings
      </p>
      <p
        *ngIf="shouldShowError('country')"
        id="country-error"
        class="form-field__error"
        role="alert"
      >
        {{ getErrorMessage('country') }}
      </p>
    </div>

    <!-- Actions -->
    <div class="step-panel__actions">
      <button
        type="button"
        class="btn btn--ghost"
        (click)="onBack()"
      >
        <svg class="btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
      <button
        type="submit"
        class="btn btn--primary"
      >
        Review & Submit
        <svg class="btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </form>
</div>
